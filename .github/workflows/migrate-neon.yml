name: Migrate Neon Database Schema

on:
  # Auto-run whenever schema files change on main
  push:
    branches:
      - main
    paths:
      - 'lib/db/src/schema/**'
      - 'lib/db/drizzle.config.ts'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'

  # Also allow manual trigger (useful for forcing a re-run)
  workflow_dispatch:

jobs:
  migrate:
    name: Push Schema to Neon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ── Pre-migration: sanitize transactions.date values ─────────────────────
      # H4 changes transactions.date from text → date column type.
      # PostgreSQL will CAST each text value during ALTER COLUMN TYPE; any value
      # that is not a valid date string will abort the migration.
      #
      # This step normalises all known non-YYYY-MM-DD formats to YYYY-MM-DD
      # before drizzle-kit push runs, so the type-change CAST always succeeds.
      # For any date that is truly unparseable, we fall back to the row's
      # created_at date so no data is lost and NOT NULL is never violated.
      - name: Sanitize transaction date formats (H4 pre-migration)
        run: |
          psql "$DATABASE_URL" << 'SQL'
            -- 1. DD/MM/YYYY  →  YYYY-MM-DD  (most common non-standard format)
            UPDATE transactions
              SET date = to_char(to_date(date, 'DD/MM/YYYY'), 'YYYY-MM-DD')
              WHERE date ~ '^\d{2}/\d{2}/\d{4}$';

            -- 2. DD-MM-YYYY  →  YYYY-MM-DD
            UPDATE transactions
              SET date = to_char(to_date(date, 'DD-MM-YYYY'), 'YYYY-MM-DD')
              WHERE date ~ '^\d{2}-\d{2}-\d{4}$';

            -- 3. D/M/YYYY or M/D/YYYY short-form (treat as DD/MM/YYYY for Uganda locale)
            UPDATE transactions
              SET date = to_char(to_date(date, 'FMDD/FMMM/YYYY'), 'YYYY-MM-DD')
              WHERE date ~ '^\d{1,2}/\d{1,2}/\d{4}$'
                AND date !~ '^\d{4}-';

            -- 4. Report any remaining non-conforming dates before nulling them
            SELECT id, date AS unparseable_date
              FROM transactions
              WHERE date !~ '^\d{4}-\d{2}-\d{2}$';

            -- 5. Last resort: replace truly unparseable values with the row's created_at
            --    date so NOT NULL is preserved and the migration can proceed.
            UPDATE transactions
              SET date = to_char(created_at AT TIME ZONE 'UTC', 'YYYY-MM-DD')
              WHERE date !~ '^\d{4}-\d{2}-\d{2}$';
          SQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSLMODE: require

      # ── Pre-migration: apply column type changes with explicit USING clause ──────
      # drizzle-kit push --force skips interactive prompts but does NOT add the
      # USING clause that PostgreSQL requires for certain type changes:
      #
      #   H4: transactions.date   text → date
      #       PostgreSQL refuses "ALTER COLUMN TYPE date" on a text column without
      #       "USING date::date" because it cannot implicitly cast text→date.
      #
      #   H5: contributions.amount  integer → numeric(12,2)
      #       integer→numeric is normally safe, but an explicit USING eliminates
      #       any ambiguity and makes this step idempotent on re-runs.
      #
      # Running these ALTER statements first means drizzle-kit sees the columns
      # are already the correct type and skips them — no conflict, no error.
      # Both statements are idempotent: if the column is already the target type
      # PostgreSQL is a no-op.
      - name: Apply column type changes with USING clause (H4 + H5)
        run: |
          psql "$DATABASE_URL" << 'SQL'
            -- H4: text → date (requires explicit USING; drizzle-kit cannot add this)
            ALTER TABLE transactions
              ALTER COLUMN date TYPE date USING date::date;

            -- H5: integer → numeric(12,2)
            ALTER TABLE contributions
              ALTER COLUMN amount TYPE numeric(12, 2) USING amount::numeric;
          SQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSLMODE: require

      # ── Push schema ───────────────────────────────────────────────────────────
      # H4 and H5 columns are already the right type by this point, so drizzle-kit
      # will skip them and cleanly apply everything else (H1 indexes, H2 enum,
      # H7 new columns, password-reset columns, etc.).
      - name: Push schema to Neon
        run: pnpm --filter @workspace/db run push-force
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
